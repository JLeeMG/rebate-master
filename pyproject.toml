[project]
name = "mgrm"
version = "0.1.0"
description = "MacGear Rebate Master"
requires-python = ">=3.12"
# Lower bounds only. The exact versions installed, tested and audited are in requirements.lock;
# install from that file (see the README), and refresh it deliberately.
dependencies = [
    "fastapi>=0.140",
    "uvicorn>=0.50",
    "sqlalchemy>=2.1",
    "psycopg[binary]>=3.3",
    "alembic>=1.20",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.30",
    "itsdangerous>=2.2",
    "argon2-cffi>=25.1",
    "authlib>=1.8",
    "httpx>=0.28",
    "pydantic-settings>=2.15",
    "python-dotenv>=1.2",
    "openpyxl>=3.1.5",
    "defusedxml>=0.7.1",  # openpyxl uses it, when installed, to read workbook XML safely
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "pip-audit>=2.9"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mgrm*"]

[tool.setuptools.package-data]
mgrm = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
