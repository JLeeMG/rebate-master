{% extends "base.html" %}
{% block title %}Change password · {{ APP_NAME }}{% endblock %}
{% block content %}
<section class="narrow">
  <h1>Change your password</h1>
  {% if user.must_change_password %}
  <p class="notice">Your password was set by someone else. Choose your own before continuing.</p>
  {% endif %}
  <form method="post" action="/account/password">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Current password <input type="password" name="current_password" required autocomplete="current-password"></label>
    <label>New password (at least 12 characters) <input type="password" name="new_password" required minlength="12" autocomplete="new-password"></label>
    <label>New password again <input type="password" name="confirm_password" required minlength="12" autocomplete="new-password"></label>
    <button type="submit">Change password</button>
  </form>
</section>
{% endblock %}
